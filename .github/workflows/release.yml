name: Release

# Automatic: when VERSION changes on main (or this workflow changes), build TinyHand and publish
# release v<VERSION> with just the installer and the portable zip, unless it already exists.
# The update feed the app reads goes to GitHub Pages (omichrome.github.io/tinyhand-win/updates).
on:
  push:
    branches: [main]
    paths:
      - VERSION
      - .github/workflows/release.yml
      - .github/release-notes.md
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      released: ${{ steps.version.outputs.exists == 'false' }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          gh release view "v$v" --repo ${{ github.repository }} *> $null
          $exists = $LASTEXITCODE -eq 0
          "version=$v" >> $env:GITHUB_OUTPUT
          "exists=$($exists.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if ($exists) { Write-Host "v$v is already released; nothing to do." } else { Write-Host "Releasing v$v" }
          exit 0

      - uses: actions/setup-dotnet@v4
        if: steps.version.outputs.exists == 'false'
        with:
          dotnet-version: 10.0.x

      - name: Build and pack
        if: steps.version.outputs.exists == 'false'
        shell: pwsh
        run: ./scripts/pack.ps1 -Version ${{ steps.version.outputs.version }}

      - name: Publish release
        if: steps.version.outputs.exists == 'false'
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          (Get-Content .github/release-notes.md -Raw).Replace('{{VERSION}}', $v) | Set-Content notes.md
          gh release create "v$v" Releases/TinyHand-win-Setup.exe Releases/TinyHand-win-Portable.zip `
            --repo ${{ github.repository }} --target ${{ github.sha }} --title "TinyHand $v" --notes-file notes.md --latest

      - name: Collect update feed
        if: steps.version.outputs.exists == 'false'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force feed | Out-Null
          Copy-Item Releases/releases.win.json, Releases/RELEASES, Releases/*-full.nupkg feed/

      - uses: actions/upload-artifact@v4
        if: steps.version.outputs.exists == 'false'
        with:
          name: feed
          path: feed

  # Pages = the website (site/) + the new update feed under /updates.
  pages:
    needs: build
    if: needs.build.outputs.released == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: feed
          path: _site/updates

      - name: Add the website
        run: cp -r site/. _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
